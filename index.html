@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');

/* Zoom lock: only panning is allowed. Blocks pinch-zoom and double-tap-zoom; normal scroll, taps and horizontal scrollers are unaffected. */
html, body{ touch-action:pan-x pan-y }

.gn-root{
  --bg0:#020B18; --bg1:#031426; --bg2:#061B2D;
  --cyan:#00D9FF; --cyan2:#00BFFF; --blue:#008CFF;
  --text:#FFFFFF; --text2:#A8B6C7; --text3:#6F8299;
  --orange:#FF9A1F; --coral:#FF7A8A;
  --line:rgba(0,217,255,.26); --line-soft:rgba(0,217,255,.13);
  --glow:.28; --nav-space:112px;
  --card-a:rgba(9,36,62,.72); --card-b:rgba(4,20,38,.84);
  --radius:24px;
  touch-action:pan-x pan-y;
  position:relative; min-height:100vh; color:var(--text); background:var(--bg0);
  font-family:'Outfit','Lexend','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; overflow-x:hidden; line-height:1.4;
}
.gn-root[data-accent="electric"]{ --cyan:#2EA8FF; --cyan2:#1B8CFF; --blue:#0A6CFF; --line:rgba(46,168,255,.3); --line-soft:rgba(46,168,255,.14); }
.gn-root[data-glow="low"]{ --glow:.12 }
.gn-root[data-glow="high"]{ --glow:.5 }
.gn-root *, .gn-root *::before, .gn-root *::after{ box-sizing:border-box }
/* remove the default mobile tap-highlight rectangle (Android/Samsung/Chrome/Safari) on every tappable element, incl. modals/toasts rendered outside .gn-root */
html, body, *, *::before, *::after{ -webkit-tap-highlight-color:transparent }
/* no text selection / copy / long-press callout / image drag anywhere; form fields stay editable */
*, *::before, *::after{ -webkit-user-select:none; user-select:none; -webkit-touch-callout:none }
input, textarea, select, [contenteditable]{ -webkit-user-select:text; user-select:text }
img, svg, a{ -webkit-user-drag:none; user-drag:none }
:where(.gn-root) button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0 }
:where(.gn-root) a{ color:inherit; text-decoration:none }
:where(.gn-root) img{ display:block; max-width:100% }
:where(.gn-root) :is(h1,h2,h3,h4,p){ margin:0 }
.gn-root :focus-visible{ outline:2px solid var(--cyan); outline-offset:3px; border-radius:10px }
.gn-root ::selection{ background:rgba(0,217,255,.35) }
.gn-root ::-webkit-scrollbar{ height:8px; width:8px }
.gn-root ::-webkit-scrollbar-thumb{ background:rgba(0,217,255,.25); border-radius:8px }
.gn-sr{ position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap }

/* ---------- animated background ---------- */
.gn-bg{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  background:
   radial-gradient(1100px 640px at 88% -8%, rgba(0,140,255,.24), transparent 62%),
   radial-gradient(900px 620px at -4% 104%, rgba(0,217,255,.11), transparent 60%),
   linear-gradient(180deg,#020B18 0%,#031426 52%,#020B18 100%); }
.gn-bg-grid{ position:absolute; inset:0; opacity:.9;
  background-image:linear-gradient(rgba(0,217,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,217,255,.03) 1px,transparent 1px);
  background-size:56px 56px; -webkit-mask-image:radial-gradient(ellipse at 70% 20%,#000 0%,transparent 70%); mask-image:radial-gradient(ellipse at 70% 20%,#000 0%,transparent 70%); }
.gn-bg svg{ position:absolute; inset:0; width:100%; height:100%; will-change:transform; contain:strict }
.gn-bg-line{ stroke:var(--cyan); fill:none; stroke-width:1.2; stroke-dasharray:180 1400; opacity:.55; animation:gn-dash 26s linear infinite }
.gn-bg-line.gn-bg-halo{ stroke-width:7; stroke-linecap:round; opacity:.13 }
.gn-bg-line.b.gn-bg-halo{ opacity:.09 }
.gn-bg-line.b{ animation-duration:38s; animation-direction:reverse; opacity:.35 }
.gn-bg-sweep{ position:absolute; top:-30%; left:-40%; width:60%; height:160%; transform:rotate(18deg);
  background:linear-gradient(90deg,transparent,rgba(0,190,255,.06),transparent); animation:gn-sweep 34s ease-in-out infinite }
.gn-bg-dot{ position:absolute; width:3px; height:3px; border-radius:50%; background:var(--cyan); box-shadow:0 0 10px 2px rgba(0,217,255,.6); opacity:0; animation:gn-float linear infinite }
@keyframes gn-dash{ to{ stroke-dashoffset:-1580 } }
@keyframes gn-sweep{ 0%,100%{ transform:translateX(0) rotate(18deg) } 50%{ transform:translateX(260%) rotate(18deg) } }
@keyframes gn-float{ 0%{ transform:translateY(0); opacity:0 } 15%{ opacity:.55 } 85%{ opacity:.35 } 100%{ transform:translateY(-140px); opacity:0 } }

/* ---------- layout ---------- */
.gn-app{ position:relative; z-index:1 }
.gn-shell{ width:100%; max-width:1200px; margin-left:auto; margin-right:auto; padding-left:20px; padding-right:20px }
/* --nav-space = measured nav height + its bottom offset (incl. safe area). Set live by <Navigation/>. */
.gn-main{ padding-top:8px; padding-bottom:calc(var(--nav-space) + 32px) }
.gn-stack{ display:flex; flex-direction:column; gap:18px }
.gn-row{ display:flex; align-items:center; gap:12px }
.gn-wrap{ flex-wrap:wrap }
.gn-grow{ flex:1; min-width:0 }
.gn-grid{ display:grid; gap:18px; grid-template-columns:repeat(12,minmax(0,1fr)) }
.gn-grid > *{ min-width:0 }
.gn-c12{ grid-column:span 12 } .gn-c8{ grid-column:span 8 } .gn-c7{ grid-column:span 7 } .gn-c6{ grid-column:span 6 } .gn-c5{ grid-column:span 5 } .gn-c4{ grid-column:span 4 } .gn-c3{ grid-column:span 3 }
.gn-cols-2{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px }
.gn-cols-3{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px }
.gn-cols-4{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px }
@media (max-width:1000px){
  .gn-c8,.gn-c7,.gn-c6,.gn-c5,.gn-c4{ grid-column:span 12 }
  .gn-c3{ grid-column:span 6 }
  .gn-cols-3{ grid-template-columns:repeat(2,minmax(0,1fr)) }
  .gn-cols-4{ grid-template-columns:repeat(2,minmax(0,1fr)) }
}
@media (max-width:640px){
  .gn-shell{ padding-left:14px; padding-right:14px }
  .gn-cols-3{ grid-template-columns:1fr }
  .gn-cols-2.keep{ grid-template-columns:repeat(2,minmax(0,1fr)) }
  .gn-cols-2{ grid-template-columns:1fr }
  .gn-grid{ gap:14px }
}

/* ---------- header ---------- */
.gn-header{ position:sticky; top:0; z-index:30; padding:16px 0 14px;
  background:linear-gradient(180deg,rgba(2,11,24,.94) 0%,rgba(2,11,24,.7) 65%,rgba(2,11,24,0) 100%) }
.gn-header-in{ display:flex; align-items:center; justify-content:space-between; gap:12px }
.gn-brand{ display:flex; align-items:center; gap:14px; min-width:0; cursor:pointer; text-align:left }
.gn-brand img{ height:64px; width:auto; filter:drop-shadow(0 0 12px rgba(0,190,255,.35)) }
.gn-brand-t{ font-size:32px; font-weight:700; line-height:1; letter-spacing:.005em; white-space:nowrap }
.gn-brand-t .c{ color:var(--cyan) } .gn-brand-t .s{ color:#B7C0CC }
.gn-brand-s{ margin-top:8px; font-size:11.5px; letter-spacing:.34em; color:#C6D0DC; white-space:nowrap; font-weight:500 }
  .gn-pin{ position:relative; display:inline-flex; align-items:center; gap:10px; height:48px; padding:0 22px 0 18px; border-radius:999px; flex-shrink:0;
  border:1px solid rgba(0,217,255,.55); font-size:17px; font-weight:500;
  background:linear-gradient(180deg,rgba(6,34,58,.8),rgba(3,18,34,.8)); backdrop-filter:blur(12px);
  box-shadow:0 0 calc(var(--glow)*80px) rgba(0,180,255,calc(var(--glow)*1.1)), inset 0 0 16px rgba(0,217,255,.12); transition:transform .18s, box-shadow .2s }
.gn-pin svg{ color:var(--cyan); filter:drop-shadow(0 0 6px var(--cyan)) }
.gn-pin:hover{ transform:translateY(-1px); box-shadow:0 0 34px rgba(0,190,255,.5), inset 0 0 16px rgba(0,217,255,.2) }
.gn-pin:active{ transform:scale(.97) }
.gn-pin-n{ position:absolute; top:-5px; right:-3px; min-width:20px; height:20px; padding:0 5px; border-radius:10px; font-size:11px; font-weight:700; display:grid; place-items:center; color:#02121f; background:var(--cyan); box-shadow:0 0 10px var(--cyan) }
.gn-header-actions{ display:flex; align-items:center; gap:10px; flex-shrink:0 }
.gn-langbtn{ display:inline-flex; align-items:center; gap:6px; height:38px; padding:0 14px; border-radius:999px; flex-shrink:0;
  border:1px solid rgba(0,217,255,.5); font-size:13.5px; font-weight:600; letter-spacing:.01em; color:var(--text);
  background:linear-gradient(180deg,rgba(6,34,58,.72),rgba(3,18,34,.72)); backdrop-filter:blur(12px);
  box-shadow:0 0 calc(var(--glow)*50px) rgba(0,180,255,calc(var(--glow)*.9)), inset 0 0 12px rgba(0,217,255,.1);
  transition:transform .18s, box-shadow .2s, border-color .2s; cursor:pointer }
.gn-langbtn svg{ color:var(--cyan); filter:drop-shadow(0 0 5px var(--cyan)) }
.gn-langbtn:hover{ transform:translateY(-1px); border-color:rgba(0,217,255,.85); box-shadow:0 0 26px rgba(0,190,255,.45), inset 0 0 12px rgba(0,217,255,.18) }
.gn-langbtn:active{ transform:scale(.95) }
@media (max-width:640px){ .gn-langbtn{ height:34px; padding:0 11px; font-size:12.5px; gap:5px } }
@media (max-width:360px){ .gn-langbtn span{ display:none } .gn-langbtn{ padding:0 9px } }
[dir="rtl"] .gn-root{ direction:rtl }
[dir="rtl"] .gn-brand{ text-align:right }
[dir="rtl"] .gn-pin-n{ right:auto; left:-3px }
[dir="rtl"] .gn-back svg,[dir="rtl"] .gn-link svg,[dir="rtl"] .gn-nav-i svg{ transform:scaleX(-1) }
[dir="rtl"] .gn-search svg{ order:1 }
[dir="rtl"] .gn-stat-top,[dir="rtl"] .gn-row:not(.gn-wrap){ direction:rtl }
/* ---- Arabic (RTL) typography & layout ---- */
[dir="rtl"] .gn-root, [dir="rtl"] .gn-root *{ letter-spacing:0!important }
[dir="rtl"] .gn-root{ font-family:'Tajawal','Outfit','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif }
[dir="rtl"] .gn-brand-t .s{ display:none }
[dir="rtl"] .gn-card.gn-hover,[dir="rtl"] .gn-row-item,[dir="rtl"] .gn-stat,[dir="rtl"] .gn-tbl th,[dir="rtl"] .gn-menu button,[dir="rtl"] .gn-sess{ text-align:right }
[dir="rtl"] .gn-sess{ padding:9px 12px 9px 10px; border-left:1px solid rgba(0,217,255,.24); border-right:3px solid var(--cyan) }
[dir="rtl"] .gn-sess.done{ border-left-color:rgba(44,201,141,.2); border-right-color:#2cc98d }
[dir="rtl"] .gn-sess.cancelled{ border-left-color:rgba(255,122,138,.18); border-right-color:var(--coral) }
[dir="rtl"] .gn-search svg{ left:auto; right:15px; order:0 }
[dir="rtl"] .gn-search .gn-input{ padding-left:16px; padding-right:44px }
[dir="rtl"] select.gn-input{ background-position:14px 21px,20px 21px; padding-right:16px; padding-left:38px }
[dir="rtl"] .gn-hero-img{ right:auto; left:0; -webkit-mask-image:linear-gradient(270deg,transparent 0%,#000 46%); mask-image:linear-gradient(270deg,transparent 0%,#000 46%) }
[dir="rtl"] .gn-hero::after{ background:linear-gradient(270deg,rgba(2,11,24,.8) 0%,rgba(2,11,24,.45) 42%,transparent 70%) }
[dir="rtl"] .gn-tbl td:first-child{ border-radius:0 16px 16px 0; border-left:0; border-right:1px solid transparent }
[dir="rtl"] .gn-tbl td:last-child{ border-radius:16px 0 0 16px; border-right:0; border-left:1px solid transparent }
[dir="rtl"] .gn-tbl tbody tr:hover td:first-child{ border-left-color:transparent; border-right-color:rgba(0,217,255,.28) }
[dir="rtl"] .gn-tbl tbody tr:hover td:last-child{ border-right-color:transparent; border-left-color:rgba(0,217,255,.28) }
[dir="rtl"] .gn-arrowc svg,[dir="rtl"] .gn-row-item > svg:last-child:not(:first-child){ transform:scaleX(-1) }

@media (max-width:640px){
  .gn-brand img{ height:48px } .gn-brand{ gap:10px }
  .gn-brand-t{ font-size:23px } .gn-brand-s{ font-size:9px; letter-spacing:.26em; margin-top:6px }
  .gn-pin{ height:42px; padding:0 14px 0 12px; font-size:15px; gap:8px }
}
@media (max-width:400px){ .gn-pin span.t{ display:none } .gn-pin{ padding:0 12px } }

/* ---------- navigation ---------- */
.gn-nav{ position:fixed; left:50%; bottom:calc(16px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:40; width:min(calc(100% - 20px),820px);
  display:grid; grid-template-columns:repeat(4,1fr); align-items:stretch; height:82px; padding:0 6px; border-radius:44px;
  background:linear-gradient(180deg,rgba(8,34,58,.82),rgba(3,16,30,.94)); border:1px solid rgba(0,217,255,.34); backdrop-filter:blur(18px);
  box-shadow:0 0 calc(var(--glow)*100px) rgba(0,170,255,calc(var(--glow)*.7)), 0 18px 44px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05) }
.gn-nav-i{ position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px; color:var(--text2); font-size:14px; letter-spacing:.02em; border-radius:36px; transition:color .2s, transform .15s }
.gn-nav-i svg{ width:30px; height:30px; transition:transform .25s, filter .25s }
.gn-nav-i:hover{ color:#fff } .gn-nav-i:active{ transform:scale(.95) }
.gn-nav-i[aria-current="page"]{ color:var(--cyan) }
.gn-nav-i[aria-current="page"] svg{ filter:drop-shadow(0 0 8px var(--cyan)); transform:translateY(-1px) scale(1.05) }
.gn-nav-i::after{ content:""; position:absolute; bottom:5px; left:50%; height:4px; width:0; border-radius:4px; background:var(--cyan); box-shadow:0 0 12px var(--cyan); transform:translateX(-50%); transition:width .3s cubic-bezier(.2,.9,.3,1.2) }
.gn-nav-i[aria-current="page"]::after{ width:46% }
@media (max-width:640px){ .gn-nav{ height:74px; bottom:calc(10px + env(safe-area-inset-bottom,0px)) } .gn-nav-i{ font-size:12.5px } .gn-nav-i svg{ width:26px; height:26px } }

/* ---------- cards ---------- */
.gn-card{ position:relative; border-radius:var(--radius); border:1px solid var(--line);
  background:linear-gradient(180deg,var(--card-a),var(--card-b));
  box-shadow:0 0 calc(var(--glow)*90px) rgba(0,150,255,calc(var(--glow)*.5)), inset 0 0 40px rgba(0,140,255,.05); overflow:hidden }
.gn-pad{ padding:22px } .gn-pad-s{ padding:16px }
@media (max-width:640px){ .gn-pad{ padding:18px } }
.gn-card.gn-hover{ transition:transform .22s ease, box-shadow .22s ease, border-color .22s; cursor:pointer; text-align:left; display:block; width:100% }
.gn-card.gn-hover:hover{ transform:translateY(-3px); border-color:rgba(0,217,255,.55); box-shadow:0 10px 40px rgba(0,150,255,.22), 0 0 30px rgba(0,217,255,.15) }
.gn-card.gn-hover:active{ transform:translateY(-1px) scale(.995) }
.gn-cardtitle{ font-size:18px; font-weight:600; letter-spacing:.005em }
.gn-muted{ color:var(--text2) } .gn-dim{ color:var(--text3) } .gn-cyan{ color:var(--cyan) }
.gn-small{ font-size:13px } .gn-xs{ font-size:12px }
.gn-h1{ font-size:clamp(26px,3.4vw,36px); font-weight:600; letter-spacing:.005em }
.gn-clamp2{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
.gn-truncate{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.gn-divider{ height:1px; background:linear-gradient(90deg,transparent,var(--line),transparent); border:0; margin:0 }

/* ---------- buttons ---------- */
.gn-btn{ display:inline-flex; align-items:center; justify-content:center; gap:10px; height:50px; padding:0 28px; border-radius:999px; font-weight:500; font-size:17px; color:#fff;
  background:linear-gradient(90deg,#0A9BFF 0%,#00C8FF 60%,#00E0FF 100%); box-shadow:0 0 calc(var(--glow)*90px) rgba(0,190,255,calc(var(--glow)*1.4)), inset 0 1px 0 rgba(255,255,255,.28);
  transition:transform .15s, box-shadow .2s, filter .2s; white-space:nowrap }
.gn-btn:hover{ filter:brightness(1.08); box-shadow:0 0 34px rgba(0,200,255,.55), inset 0 1px 0 rgba(255,255,255,.3) }
.gn-btn:active{ transform:scale(.97) }
.gn-btn[disabled]{ opacity:.55; cursor:not-allowed; filter:none }
.gn-btn.block{ width:100% }
.gn-btn.sm{ height:38px; padding:0 18px; font-size:14.5px; gap:8px }
.gn-btn.ghost{ background:rgba(0,217,255,.06); border:1px solid rgba(0,217,255,.4); color:var(--cyan); box-shadow:none }
.gn-btn.ghost:hover{ background:rgba(0,217,255,.14); box-shadow:0 0 20px rgba(0,217,255,.25) }
.gn-btn.danger{ background:rgba(255,122,138,.08); border:1px solid rgba(255,122,138,.45); color:var(--coral); box-shadow:none }
.gn-btn.danger:hover{ background:rgba(255,122,138,.16) }
.gn-icobtn{ display:inline-grid; place-items:center; width:38px; height:38px; border-radius:12px; color:var(--text2); border:1px solid transparent; transition:all .18s }
.gn-icobtn:hover{ color:var(--cyan); background:rgba(0,217,255,.1); border-color:rgba(0,217,255,.3) }
.gn-icobtn:active{ transform:scale(.92) }
.gn-link{ display:inline-flex; align-items:center; gap:4px; color:var(--cyan); font-size:16px; border-radius:8px; transition:gap .15s, filter .15s }
.gn-link:hover{ gap:8px; filter:brightness(1.15) }
.gn-back{ display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 16px 0 10px; border-radius:999px; border:1px solid var(--line); background:rgba(4,22,40,.6); color:var(--text2); transition:all .18s }
.gn-back:hover{ color:var(--cyan); border-color:rgba(0,217,255,.55) }

/* ---------- badges / chips / avatars ---------- */
.gn-badge{ display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 11px; border-radius:999px; font-size:12.5px; font-weight:500; border:1px solid var(--line); color:var(--cyan); background:rgba(0,217,255,.09); white-space:nowrap }
.gn-badge i{ width:6px; height:6px; border-radius:50%; background:currentColor; box-shadow:0 0 8px currentColor }
.gn-badge.orange{ color:var(--orange); border-color:rgba(255,154,31,.4); background:rgba(255,154,31,.09) }
.gn-badge.red{ color:var(--coral); border-color:rgba(255,122,138,.4); background:rgba(255,122,138,.08) }
.gn-badge.gray{ color:var(--text2); border-color:rgba(168,182,199,.25); background:rgba(168,182,199,.07) }
.gn-chips{ display:flex; gap:8px; overflow-x:auto; padding:2px 2px 6px }
.gn-chip{ flex-shrink:0; height:36px; padding:0 16px; border-radius:999px; font-size:14.5px; color:var(--text2); border:1px solid rgba(0,217,255,.18); background:rgba(4,22,40,.55); transition:all .18s }
.gn-chip:hover{ color:#fff; border-color:rgba(0,217,255,.5) }
.gn-chip[aria-pressed="true"]{ color:var(--cyan); border-color:rgba(0,217,255,.7); background:rgba(0,217,255,.12); box-shadow:0 0 18px rgba(0,217,255,.2) }
.gn-avatar{ position:relative; flex-shrink:0; display:grid; place-items:center; border-radius:50%; font-weight:600; color:#dff8ff; overflow:hidden;
  background:linear-gradient(140deg,#0B3A66,#06263f); border:1.5px solid rgba(0,217,255,.55); box-shadow:0 0 14px rgba(0,190,255,.28) }
.gn-avatar img{ width:100%; height:100%; object-fit:cover }

/* ---------- section header ---------- */
.gn-sec{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin:8px 2px 0 }
.gn-sec-t{ display:flex; align-items:center; gap:12px; font-size:17px; letter-spacing:.3em; color:#dbe6f1; font-weight:400 }
.gn-sec-t svg{ color:var(--cyan); filter:drop-shadow(0 0 6px rgba(0,217,255,.7)) }
.gn-sec-t.plain{ letter-spacing:.01em; font-size:20px; font-weight:600; color:#fff }

/* ---------- news ---------- */
.gn-hero{ position:relative; min-height:300px; display:flex; align-items:center }
.gn-hero::after{ content:""; position:absolute; inset:0; z-index:0; pointer-events:none; background:linear-gradient(90deg,rgba(2,11,24,.8) 0%,rgba(2,11,24,.45) 42%,transparent 70%) }
.gn-hero-img{ position:absolute; top:0; right:0; bottom:0; height:100%; width:66%; object-fit:cover; object-position:center;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 46%); mask-image:linear-gradient(90deg,transparent 0%,#000 46%) }
.gn-hero-in{ position:relative; z-index:1; padding:34px 36px; max-width:60% }
.gn-hero-k{ font-size:clamp(15px,1.6vw,19px); letter-spacing:.06em; color:var(--cyan); font-weight:400 }
.gn-hero-h{ font-size:clamp(34px,4.2vw,52px); font-weight:600; line-height:1.05; margin:8px 0 14px; letter-spacing:.005em }
.gn-hero-bar{ width:76px; height:3px; border-radius:3px; background:var(--cyan); box-shadow:0 0 12px var(--cyan); margin-bottom:16px }
.gn-hero-p{ font-size:clamp(14px,1.4vw,17px); line-height:1.6; color:#e8eef5 }
@media (max-width:640px){ .gn-hero{ min-height:250px } .gn-hero-in{ padding:22px 20px; max-width:66% } .gn-hero-img{ width:78% } }
.gn-pinned-ic{ width:64px; height:64px; border-radius:18px; display:grid; place-items:center; flex-shrink:0; color:#dff8ff; border:1px solid rgba(0,217,255,.55); background:linear-gradient(140deg,rgba(0,140,255,.35),rgba(0,217,255,.14)); box-shadow:0 0 20px rgba(0,190,255,.3) }
.gn-date{ display:flex; align-items:center; gap:9px; color:var(--cyan); font-size:16px }
.gn-news-title{ font-size:clamp(20px,2.2vw,27px); font-weight:600; line-height:1.2 }
.gn-newscard{ display:flex!important; flex-direction:column; padding:0!important }
.gn-newscard-img{ position:relative; height:172px; overflow:hidden; background:#04182b }
.gn-newscard-img img.ph{ width:100%; height:100%; object-fit:cover; transition:transform .5s }
.gn-newscard:hover .gn-newscard-img img.ph{ transform:scale(1.05) }
.gn-art{ position:relative; width:100%; height:100%; display:grid; place-items:center; overflow:hidden;
  background:radial-gradient(circle at 30% 20%,rgba(0,190,255,.35),transparent 55%),linear-gradient(140deg,#052a4b,#031426 70%) }
.gn-art img{ position:absolute; right:-14px; bottom:-20px; height:120%; width:auto; opacity:.13; filter:grayscale(.2) }
.gn-art svg{ position:relative; color:var(--cyan); filter:drop-shadow(0 0 12px var(--cyan)) }
.gn-newscard-b{ padding:18px 20px 20px; display:flex; flex-direction:column; gap:8px; flex:1 }
.gn-newscard-b h3{ font-size:19px; font-weight:600; line-height:1.25 }
.gn-newscard-f{ margin-top:auto; padding-top:8px; display:flex; align-items:center; justify-content:space-between; color:var(--cyan); font-size:15px }
.gn-arrowc{ width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:rgba(0,217,255,.12); border:1px solid rgba(0,217,255,.4); transition:all .2s }
.gn-newscard:hover .gn-arrowc{ background:var(--cyan); color:#021523; box-shadow:0 0 16px var(--cyan) }
.gn-row-item{ display:flex; align-items:center; gap:14px; width:100%; text-align:left; padding:14px 16px; border-radius:18px; border:1px solid transparent; transition:all .18s }
.gn-row-item:hover{ background:rgba(0,217,255,.07); border-color:rgba(0,217,255,.3) }
/* news three-dots menu */
.gn-newsdots{ position:absolute; top:12px; right:12px; z-index:6; display:block }
[dir="rtl"] .gn-newsdots{ right:auto; left:12px }
.gn-newsdots.inline{ position:relative; top:auto; right:auto; left:auto; z-index:auto; flex:0 0 auto }
[dir="rtl"] .gn-newsdots.inline{ right:auto; left:auto }
/* memberships donut: keep legend beside the chart in Arabic */
[dir="rtl"] .gn-mix{ flex-wrap:nowrap; direction:ltr; gap:14px!important }
[dir="rtl"] .gn-mix > svg{ flex:0 1 auto; width:auto; max-width:42%; height:auto }
[dir="rtl"] .gn-mix > div{ direction:rtl; min-width:0; flex:1 1 auto }
.gn-newsdots .gn-icobtn{ background:rgba(2,14,28,.72); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px) }
.gn-prose p{ font-size:17px; line-height:1.75; color:#dbe5ef; margin:0 0 16px; max-width:70ch }

/* ---------- forms ---------- */
.gn-field{ display:flex; flex-direction:column; gap:7px }
.gn-label{ font-size:13px; color:var(--text2); letter-spacing:.01em }
.gn-input{ width:100%; height:48px; padding:0 16px; border-radius:14px; color:#fff; font:inherit; font-size:16px; outline:none;
  background:rgba(2,14,28,.72); border:1px solid rgba(0,217,255,.22); transition:border-color .18s, box-shadow .18s }
textarea.gn-input{ height:auto; min-height:110px; padding:12px 16px; resize:vertical; line-height:1.5 }
select.gn-input{ appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--cyan) 50%),linear-gradient(135deg,var(--cyan) 50%,transparent 50%); background-position:calc(100% - 20px) 21px,calc(100% - 14px) 21px; background-size:6px 6px; background-repeat:no-repeat; padding-right:38px }
select.gn-input option{ background:#04182b; color:#fff }
.gn-input::placeholder{ color:var(--text3) }
.gn-input:hover{ border-color:rgba(0,217,255,.4) }
.gn-input:focus{ border-color:var(--cyan); box-shadow:0 0 0 3px rgba(0,217,255,.16), 0 0 20px rgba(0,217,255,.18) }
.gn-input[aria-invalid="true"]{ border-color:rgba(255,122,138,.7) }
.gn-err{ font-size:12.5px; color:var(--coral); display:flex; gap:6px; align-items:center }
.gn-search{ position:relative; flex:1; min-width:200px }
.gn-search svg{ position:absolute; left:15px; top:14px; color:var(--text3); pointer-events:none }
.gn-search .gn-input{ padding-left:44px }
.gn-switch{ position:relative; width:52px; height:30px; border-radius:999px; flex-shrink:0; background:rgba(168,182,199,.18); border:1px solid rgba(168,182,199,.25); transition:all .22s }
.gn-switch::after{ content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#cfd9e4; transition:transform .22s cubic-bezier(.3,1.3,.5,1), background .2s }
.gn-switch[aria-checked="true"]{ background:rgba(0,217,255,.22); border-color:var(--cyan); box-shadow:0 0 14px rgba(0,217,255,.35) }
.gn-switch[aria-checked="true"]::after{ transform:translateX(22px); background:var(--cyan); box-shadow:0 0 10px var(--cyan) }
.gn-seg{ display:inline-flex; padding:4px; gap:4px; border-radius:999px; background:rgba(2,14,28,.7); border:1px solid rgba(0,217,255,.2); max-width:100%; overflow-x:auto }
.gn-seg button{ display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 20px; border-radius:999px; color:var(--text2); font-size:15.5px; white-space:nowrap; transition:all .2s; border:1px solid transparent }
.gn-seg button:hover{ color:#fff }
.gn-seg button[aria-selected="true"], .gn-seg button[aria-pressed="true"]{ color:var(--cyan); background:linear-gradient(180deg,rgba(0,217,255,.18),rgba(0,140,255,.1)); border-color:rgba(0,217,255,.5); box-shadow:0 0 18px rgba(0,217,255,.2) }
.gn-seg.sm button{ height:34px; padding:0 14px; font-size:14px }

@media (max-width:640px){ .gn-seg button{ padding:0 13px; font-size:14.5px; gap:6px } }

/* ---------- stats ---------- */
.gn-stat{ padding:20px 22px; display:flex; flex-direction:column; gap:10px; text-align:left }
.gn-stat-top{ display:flex; align-items:center; justify-content:space-between }
.gn-stat-l{ font-size:12.5px; letter-spacing:.16em; color:var(--text2); font-weight:500 }
.gn-stat-ic{ width:40px; height:40px; border-radius:12px; display:grid; place-items:center; color:var(--cyan); background:rgba(0,217,255,.1); border:1px solid rgba(0,217,255,.3) }
.gn-stat-ic.orange{ color:var(--orange); background:rgba(255,154,31,.1); border-color:rgba(255,154,31,.35) }
.gn-stat-v{ font-size:clamp(34px,4vw,46px); font-weight:600; line-height:1; letter-spacing:-.01em; text-shadow:0 0 24px rgba(0,217,255,.35) }
@media (max-width:640px){ .gn-stat{ padding:16px } .gn-stat-l{ font-size:11px; letter-spacing:.1em } }

/* ---------- table / client cards ---------- */
.gn-tbl-wrap{ display:block; overflow-x:auto }
.gn-tbl{ width:100%; border-collapse:separate; border-spacing:0 6px; min-width:860px }
.gn-tbl th{ text-align:left; font-size:12px; font-weight:500; color:var(--text3); letter-spacing:.06em; padding:4px 14px 6px; white-space:nowrap }
.gn-tbl td{ padding:12px 14px; background:rgba(4,24,44,.5); border-top:1px solid transparent; border-bottom:1px solid transparent; vertical-align:middle; font-size:15px; transition:background .18s }
.gn-tbl td:first-child{ border-radius:16px 0 0 16px; border-left:1px solid transparent }
.gn-tbl td:last-child{ border-radius:0 16px 16px 0; border-right:1px solid transparent }
.gn-tbl tbody tr:hover td{ background:rgba(0,140,255,.12); border-top-color:rgba(0,217,255,.28); border-bottom-color:rgba(0,217,255,.28) }
.gn-tbl tbody tr:hover td:first-child{ border-left-color:rgba(0,217,255,.28) }
.gn-tbl tbody tr:hover td:last-child{ border-right-color:rgba(0,217,255,.28) }
.gn-only-m{ display:none }
@media (max-width:900px){ .gn-only-d{ display:none!important } .gn-only-m{ display:grid!important } }
.gn-ccard{ padding:16px; display:flex; flex-direction:column; gap:14px }
.gn-bar{ height:7px; border-radius:7px; background:rgba(0,217,255,.12); overflow:hidden }
.gn-bar > i{ display:block; height:100%; border-radius:7px; background:linear-gradient(90deg,#008CFF,#00E0FF); box-shadow:0 0 10px rgba(0,217,255,.6); transform-origin:left; animation:gn-grow-x .9s cubic-bezier(.2,.8,.2,1) both }
.gn-bar.orange > i{ background:linear-gradient(90deg,#FF7A00,#FFB020); box-shadow:0 0 10px rgba(255,154,31,.5) }
@keyframes gn-grow-x{ from{ transform:scaleX(0) } }
.gn-menu{ position:absolute; right:0; top:calc(100% + 6px); z-index:20; min-width:200px; padding:6px; border-radius:16px; background:rgba(3,18,34,.97); border:1px solid rgba(0,217,255,.35); box-shadow:0 18px 40px rgba(0,0,0,.6), 0 0 24px rgba(0,190,255,.15); animation:gn-pop .16s ease both }
.gn-menu button{ display:flex; width:100%; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; font-size:14.5px; color:#dbe6f1; text-align:left }
.gn-menu button:hover, .gn-menu button:focus-visible{ background:rgba(0,217,255,.12); color:var(--cyan) }
.gn-menu button.danger{ color:var(--coral) }

/* ---------- tabs ---------- */
.gn-tabbar{ overflow-x:auto; padding:2px }

/* ---------- lists ---------- */
.gn-li{ display:flex; align-items:center; gap:14px; padding:12px 4px; border-bottom:1px solid var(--line-soft) }
.gn-li:last-child{ border-bottom:0 }
.gn-kv{ display:grid; gap:14px; grid-template-columns:repeat(3,minmax(0,1fr)) }
.gn-kv > div{ padding:14px 16px; border-radius:16px; background:rgba(2,14,28,.55); border:1px solid var(--line-soft) }
.gn-kv dt{ font-size:12px; color:var(--text3); letter-spacing:.04em; margin:0 0 6px; display:flex; align-items:center; gap:7px }
.gn-kv dd{ margin:0; font-size:16px; font-weight:500; word-break:break-word }
@media (max-width:900px){ .gn-kv{ grid-template-columns:repeat(2,minmax(0,1fr)) } }
@media (max-width:420px){ .gn-kv{ grid-template-columns:1fr } }
.gn-ex{ display:flex; gap:10px; align-items:flex-start; padding:6px 0; color:#dbe6f1; font-size:15px }
.gn-ex svg{ color:var(--cyan); margin-top:2px; flex-shrink:0 }

/* ---------- charts ---------- */
.gn-chart text{ fill:var(--text3); font-size:11px; font-family:inherit }
.gn-chart .grid{ stroke:rgba(0,217,255,.09); stroke-width:1 }
.gn-draw{ stroke-dasharray:1; stroke-dashoffset:1; animation:gn-draw 1.3s cubic-bezier(.4,.1,.2,1) .1s forwards }
@keyframes gn-draw{ to{ stroke-dashoffset:0 } }
.gn-fade-in{ animation:gn-fade .9s ease .5s both }
.gn-bar-rect{ transform-box:fill-box; transform-origin:bottom; animation:gn-grow-y .8s cubic-bezier(.2,.8,.2,1) both; transition:filter .2s }
.gn-bar-rect:hover, .gn-bar-rect:focus{ filter:brightness(1.35) drop-shadow(0 0 6px var(--cyan)) }
@keyframes gn-grow-y{ from{ transform:scaleY(0) } }

/* ---------- schedule ---------- */
.gn-week{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:10px }
.gn-day{ min-height:260px; padding:12px 10px; border-radius:18px; background:rgba(3,20,38,.55); border:1px solid var(--line-soft); display:flex; flex-direction:column; gap:8px }
.gn-day.today{ border-color:rgba(0,217,255,.6); box-shadow:0 0 24px rgba(0,217,255,.14), inset 0 0 24px rgba(0,217,255,.05) }
.gn-day-h{ display:flex; align-items:baseline; justify-content:space-between; padding:0 4px 8px; border-bottom:1px solid var(--line-soft) }
.gn-day-h b{ font-size:21px; font-weight:600 } .gn-day-h span{ font-size:12px; color:var(--text2); letter-spacing:.08em }
.gn-day.today .gn-day-h b{ color:var(--cyan); text-shadow:0 0 14px var(--cyan) }
.gn-sess{ display:block; width:100%; text-align:left; padding:9px 10px 9px 12px; border-radius:12px; background:rgba(0,140,255,.13); border:1px solid rgba(0,217,255,.24); border-left:3px solid var(--cyan); transition:all .16s; position:relative }
.gn-sess:hover{ background:rgba(0,217,255,.2); transform:translateX(2px) }
.gn-sess b{ display:block; font-size:13.5px; font-weight:600 }
.gn-sess span{ display:block; font-size:12px; color:var(--text2); margin-top:2px }
.gn-sess.done{ border-left-color:#2cc98d; opacity:.8; background:rgba(44,201,141,.07); border-color:rgba(44,201,141,.2) }
.gn-sess.cancelled{ border-left-color:var(--coral); opacity:.55; background:rgba(255,122,138,.05); border-color:rgba(255,122,138,.18) }
.gn-sess.cancelled b{ text-decoration:line-through }
@media (max-width:1000px){ .gn-week{ grid-template-columns:1fr } .gn-day{ min-height:0 } }
.gn-pills{ display:flex; gap:8px; overflow-x:auto; padding:2px 2px 8px }
.gn-pill{ flex:1 0 64px; display:flex; flex-direction:column; align-items:center; gap:2px; padding:10px 6px; border-radius:18px; border:1px solid var(--line-soft); background:rgba(3,20,38,.55); color:var(--text2); transition:all .18s }
.gn-pill b{ font-size:20px; color:#fff; font-weight:600 } .gn-pill span{ font-size:12px; letter-spacing:.08em }
.gn-pill[aria-pressed="true"]{ border-color:var(--cyan); background:rgba(0,217,255,.14); box-shadow:0 0 22px rgba(0,217,255,.25) } .gn-pill[aria-pressed="true"] b{ color:var(--cyan) }
.gn-pill .dot{ width:5px; height:5px; border-radius:50%; background:var(--cyan); box-shadow:0 0 8px var(--cyan); margin-top:2px }
.gn-agenda{ display:flex; gap:16px; padding:14px 0; border-bottom:1px solid var(--line-soft) }
.gn-agenda:last-child{ border-bottom:0 }
.gn-agenda-t{ width:64px; flex-shrink:0; font-size:18px; font-weight:600; color:var(--cyan) }

/* ---------- scanner ---------- */
.gn-scanbox{ position:relative; width:min(100%,440px); aspect-ratio:1; margin:0 auto; border-radius:28px; overflow:hidden; background:radial-gradient(circle at 50% 40%,rgba(0,80,140,.35),rgba(2,10,20,.95)); border:1px solid var(--line) }
.gn-scanbox video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover }
.gn-scanbox .gridbg{ position:absolute; inset:0; background-image:linear-gradient(rgba(0,217,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,217,255,.06) 1px,transparent 1px); background-size:34px 34px }
.gn-frame{ position:absolute; inset:14%; }
.gn-corner{ position:absolute; width:44px; height:44px; border:4px solid var(--cyan); filter:drop-shadow(0 0 8px var(--cyan)) }
.gn-corner.tl{ top:0; left:0; border-right:0; border-bottom:0; border-top-left-radius:20px } .gn-corner.tr{ top:0; right:0; border-left:0; border-bottom:0; border-top-right-radius:20px }
.gn-corner.bl{ bottom:0; left:0; border-right:0; border-top:0; border-bottom-left-radius:20px } .gn-corner.br{ bottom:0; right:0; border-left:0; border-top:0; border-bottom-right-radius:20px }
.gn-laser{ position:absolute; left:4%; right:4%; height:3px; border-radius:3px; background:linear-gradient(90deg,transparent,var(--cyan),transparent); box-shadow:0 0 18px 4px rgba(0,217,255,.55); animation:gn-laser 2.6s ease-in-out infinite alternate }
@keyframes gn-laser{ from{ top:4% } to{ top:94% } }
.gn-scanbox.hit .gn-frame{ animation:gn-hit .6s ease }
@keyframes gn-hit{ 0%{ transform:scale(1) } 40%{ transform:scale(.94) } 100%{ transform:scale(1) } }
.gn-scan-c{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:26%; color:var(--text2); font-size:14px }
.gn-result-ok{ border-color:rgba(0,217,255,.7)!important; box-shadow:0 0 44px rgba(0,217,255,.25)!important }
.gn-result-warn{ border-color:rgba(255,154,31,.6)!important; box-shadow:0 0 40px rgba(255,154,31,.18)!important }
.gn-result-bad{ border-color:rgba(255,122,138,.6)!important }

/* ---------- modal / toast / states ---------- */
/* Shared dialog shell (every confirm / delete / form dialog renders through <Modal>): the overlay is pinned to the visual viewport and centres the dialog horizontally + vertically on ALL screen sizes; side/top/bottom margins respect the phone safe areas */
.gn-overlay{ position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:rgba(1,6,14,.74); backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px); overscroll-behavior:contain; animation:gn-fade .2s ease both }
/* max-height:100% = overlay height minus its padding, so the dialog can never leave the screen; overflow:hidden keeps background + content inside the rounded corners */
.gn-modal{ position:relative; width:min(580px,100%); max-height:100%; display:flex; flex-direction:column; overflow:hidden; border-radius:28px; border:1px solid rgba(0,217,255,.45);
  background:linear-gradient(180deg,rgba(8,34,60,.97),rgba(3,17,32,.98)); box-shadow:0 30px 80px rgba(0,0,0,.65), 0 0 60px rgba(0,170,255,.2); animation:gn-pop .28s cubic-bezier(.2,.9,.3,1.15) both }
.gn-modal.wide{ width:min(760px,100%) }
.gn-modal-h{ flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:20px 22px 12px }
.gn-modal-h h2{ font-size:21px; font-weight:600 }
/* long content scrolls inside the body only, so the header (close) and footer (confirm / cancel) stay visible */
.gn-modal-b{ flex:1 1 auto; min-height:0; padding:8px 22px 22px; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch }
.gn-modal-f{ flex:0 0 auto; display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; padding:14px 22px 20px; border-top:1px solid var(--line-soft) }
@keyframes gn-fade{ from{ opacity:0 } }
@keyframes gn-pop{ from{ opacity:0; transform:translateY(12px) scale(.96) } }
@keyframes gn-sheet{ from{ transform:translateY(60%); opacity:.4 } }
.gn-toasts{ position:fixed; left:50%; bottom:calc(var(--nav-space) + 12px); transform:translateX(-50%); z-index:80; display:flex; flex-direction:column; gap:8px; align-items:center; width:min(92vw,420px); pointer-events:none }
.gn-toast{ pointer-events:auto; display:flex; align-items:center; gap:12px; width:100%; padding:13px 16px; border-radius:18px; font-size:15px; background:rgba(3,20,38,.95); border:1px solid rgba(0,217,255,.5); box-shadow:0 12px 34px rgba(0,0,0,.5), 0 0 24px rgba(0,190,255,.22); backdrop-filter:blur(14px); animation:gn-toast .3s cubic-bezier(.2,.9,.3,1.1) both }
.gn-toast svg{ flex-shrink:0; color:var(--cyan) }
.gn-toast.error{ border-color:rgba(255,122,138,.6) } .gn-toast.error svg{ color:var(--coral) }
.gn-toast.warn{ border-color:rgba(255,154,31,.55) } .gn-toast.warn svg{ color:var(--orange) }
@keyframes gn-toast{ from{ opacity:0; transform:translateY(14px) scale(.96) } }
.gn-skel{ border-radius:14px; background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(0,217,255,.12),rgba(255,255,255,.04)); background-size:220% 100%; animation:gn-shimmer 1.4s linear infinite }
@keyframes gn-shimmer{ to{ background-position:-220% 0 } }
.gn-state{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:12px; padding:44px 22px }
.gn-state-ic{ width:68px; height:68px; border-radius:22px; display:grid; place-items:center; color:var(--cyan); background:rgba(0,217,255,.08); border:1px solid rgba(0,217,255,.35); box-shadow:0 0 28px rgba(0,217,255,.18) }
.gn-state.err .gn-state-ic{ color:var(--coral); background:rgba(255,122,138,.08); border-color:rgba(255,122,138,.4); box-shadow:none }
.gn-spin{ animation:gn-rot 1s linear infinite }
@keyframes gn-rot{ to{ transform:rotate(360deg) } }

/* ---------- page transition ---------- */
/* fill-mode is 'backwards' (not 'both'): a finished animation must NOT leave a transform on the page wrapper, otherwise it becomes the containing block of position:fixed children (dialogs/menus) and they stop being viewport-relative */
.gn-page{ animation:gn-page .2s cubic-bezier(.2,.8,.2,1) backwards }
@keyframes gn-page{ from{ opacity:0; transform:translateY(10px) } }
.gn-rise{ animation:gn-page .3s cubic-bezier(.2,.8,.2,1) backwards; animation-delay:min(var(--d,0ms),100ms) }
.gn-warm .gn-rise, .gn-warm .gn-bar > i, .gn-warm .gn-bar-rect, .gn-warm .gn-fade-in{ animation:none }
.gn-warm .gn-draw{ animation:none; stroke-dashoffset:0 }
/* pause the decorative background animation while scrolling / switching sections so the GPU can paint content tiles */
.gn-perf-pause .gn-bg *{ animation-play-state:paused!important }
@keyframes gn-pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(0,217,255,.5) } 50%{ box-shadow:0 0 0 8px rgba(0,217,255,0) } }
.gn-pulse{ animation:gn-pulse 2.2s ease-out infinite }

/* ---------- login ---------- */
.gn-login{ position:relative; z-index:1; min-height:100vh; display:grid; place-items:center; padding:24px }
.gn-login-card{ width:min(440px,100%); padding:32px 28px; display:flex; flex-direction:column; gap:18px; align-items:stretch }

/* ---------- motion preferences ---------- */
.gn-root[data-motion="reduced"] *, .gn-root[data-motion="reduced"] *::before, .gn-root[data-motion="reduced"] *::after{ animation-duration:.001ms!important; animation-iteration-count:1!important; transition-duration:.001ms!important }
.gn-root[data-motion="reduced"] .gn-bg-dot, .gn-root[data-motion="reduced"] .gn-bg-sweep{ display:none }

.gn-stats3{display:grid;gap:18px;grid-template-columns:repeat(4,1fr)}
.gn-plan-opt{ display:flex; align-items:center; gap:14px; width:100%; min-height:60px; text-align:start; padding:12px 16px; border-radius:18px; border:1px solid var(--line-soft); background:rgba(2,14,28,.55); color:inherit; font:inherit; cursor:pointer; transition:border-color .15s,background .15s,box-shadow .15s }
.gn-plan-opt:hover{ background:rgba(0,217,255,.07); border-color:rgba(0,217,255,.3) }
.gn-plan-opt[aria-pressed="true"]{ border-color:rgba(0,217,255,.75); background:rgba(0,217,255,.12); box-shadow:0 0 18px rgba(0,217,255,.18) }

.gn-plan-dot{ flex:0 0 auto; width:20px; height:20px; border-radius:50%; border:2px solid rgba(0,217,255,.45); box-shadow:inset 0 0 0 4px transparent; transition:all .15s }
.gn-plan-opt[aria-pressed="true"] .gn-plan-dot{ border-color:var(--cyan,#00d9ff); background:var(--cyan,#00d9ff); box-shadow:inset 0 0 0 4px #04182c }
.gn-plan-prev{ display:flex; flex-direction:column; gap:4px; padding:14px 16px; border-radius:18px; border:1px solid rgba(0,217,255,.35); background:rgba(0,217,255,.06) }
@media (max-width:1000px){.gn-stats3{grid-template-columns:repeat(4,1fr)}}
@media (max-width:640px){.gn-stats3{grid-template-columns:repeat(2,1fr)}}
.gn-dropimg{width:100%;min-height:140px;border-radius:16px;border:1px dashed rgba(0,217,255,.4);background:rgba(2,14,28,.5);display:grid;place-items:center;color:var(--text2);gap:8px;overflow:hidden;cursor:pointer}
.gn-dropimg img{width:100%;height:160px;object-fit:cover;border-radius:16px}

.gn-editcard{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.gn-daybar{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:8px;align-items:center}
.gn-exhead{display:grid;grid-template-columns:minmax(0,1fr) 70px 70px 34px;gap:8px;padding:0 2px;font-size:11px;color:var(--text3);letter-spacing:.06em}
.gn-exrow{display:grid;grid-template-columns:minmax(0,1fr) 70px 70px 34px;gap:8px;align-items:center}
@media (max-width:480px){ .gn-exhead{ display:none } .gn-exrow{ grid-template-columns:minmax(0,1fr) minmax(0,1fr) 34px } .gn-exrow>:first-child{ grid-column:1/-1 } .gn-mealtop{ grid-template-columns:minmax(0,1fr) auto } .gn-mealtop>:first-child{ grid-column:1/-1 } }
.gn-mealtop{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:8px;align-items:center}
.gn-mealbot{display:flex;align-items:center;gap:8px}
.gn-savebar{position:sticky;bottom:calc(var(--nav-space) + 12px);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-radius:16px;background:rgba(3,20,38,.96);border:1px solid rgba(0,217,255,.4);box-shadow:0 12px 34px rgba(0,0,0,.5)}
.gn-input.sm{height:40px}
/* auto-growing field (GN_AutoTA): textarea over an invisible copy of its text; same box metrics on both so the wrapper height = wrapped text height. align-self:stretch makes the other fields of the same row grow to match. */
.gn-autota{ display:grid; position:relative; min-width:0; align-self:stretch }
.gn-autota::after,.gn-autota>textarea.gn-input{ grid-area:1/1; box-sizing:border-box; min-width:0; min-height:var(--min-h,40px); padding:8px 16px; border:1px solid rgba(0,217,255,.22); border-radius:14px; font:inherit; font-size:16px; line-height:22px; white-space:pre-wrap; overflow-wrap:anywhere; word-break:normal; text-align:start }
.gn-autota::after{ content:attr(data-v) " "; visibility:hidden; pointer-events:none }
.gn-autota[data-v=""]::after{ content:attr(data-ph) " " }
.gn-autota>textarea.gn-input{ position:absolute; inset:0; width:100%; height:100%; resize:none; overflow:hidden }
[dir="rtl"] .gn-daybar,[dir="rtl"] .gn-exhead,[dir="rtl"] .gn-exrow,[dir="rtl"] .gn-mealtop{direction:rtl}

.gn-header-in{display:flex;align-items:center;justify-content:space-between;gap:10px}
.gn-addnews-fab{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid rgba(0,217,255,.45);background:rgba(0,217,255,.12);color:var(--cyan);flex:0 0 auto;transition:transform .15s,background .15s}
.gn-addnews-fab:hover{background:rgba(0,217,255,.22);transform:scale(1.06)}
.gn-addnews-fab:active{transform:scale(.94)}
@media (prefers-reduced-motion:reduce){
  .gn-root *, .gn-root *::before, .gn-root *::after{ animation-duration:.001ms!important; animation-iteration-count:1!important; transition-duration:.001ms!important }
  .gn-bg-dot, .gn-bg-sweep{ display:none }
}

F\u062E\u0648\u0644 \u0628\u0631\u0645\u0632 QR \u0627\u0639\u062A\u0628\u0627\u0631\u064B\u0627 \u0645\u0646 \u0627\u0644\u0623\u0648\u0644 \u0645\u0646 \u064A\u0648\u0646\u064A\u0648","QR code will be necessary from 1st of June!":"\u0631\u0645\u0632 QR \u0633\u064A\u0635\u0628\u062D \u0625\u0644\u0632\u0627\u0645\u064A\u064B\u0627 \u0627\u0639\u062A\u0628\u0627\u0631\u064B\u0627 \u0645\u0646 \u0627\u0644\u0623\u0648\u0644 \u0645\u0646 \u064A\u0648\u0646\u064A\u0648!","From the 1st of June every member needs a QR code to enter the gym. The code lives in the GN Gym app and is unique to each member.":"\u0627\u0639\u062A\u0628\u0627\u0631\u064B\u0627 \u0645\u0646 \u0627\u0644\u0623\u0648\u0644 \u0645\u0646 \u064A\u0648\u0646\u064A\u0648\u060C \u064A\u062D\u062A\u0627\u062C \u0643\u0644 \u0639\u0636\u0648 \u0625\u0644\u0649 \u0631\u0645\u0632 QR \u0644\u062F\u062E\u0648\u0644 \u0627\u0644\u0646\u0627\u062F\u064A. \u064A\u0648\u062C\u062F \u0627\u0644\u0631\u0645\u0632 \u062F\u0627\u062E\u0644 \u062A\u0637\u0628\u064A\u0642 GN Gym \u0648\u0647\u0648 \u0641\u0631\u064A\u062F \u0644\u0643\u0644 \u0639\u0636\u0648.","Coaches: use the SCAN tab to check a client in at the start of a session. The result shows their membership status, last visit and today's session.":"\u0644\u0644\u0645\u062F\u0631\u0628\u064A\u0646: \u0627\u0633\u062A\u062E\u062F\u0645\u0648\u0627 \u062A\u0628\u0648\u064A\u0628 \u0627\u0644\u0645\u0627\u0633\u062D \u0644\u062A\u0633\u062C\u064A\u0644 \u062D\u0636\u0648\u0631 \u0627\u0644\u0639\u0645\u064A\u0644 \u0639\u0646\u062F \u0628\u062F\u0627\u064A\u0629 \u0627\u0644\u062C\u0644\u0633\u0629. \u062A\u0639\u0631\u0636 \u0627\u0644\u0646\u062A\u064A\u062C\u0629 \u062D\u0627\u0644\u0629 \u0639\u0636\u0648\u064A\u062A\u0647 \u0648\u0622\u062E\u0631 \u0632\u064A\u0627\u0631\u0629 \u0648\u062C\u0644\u0633\u0629 \u0627\u0644\u064A\u0648\u0645.","If a client can't show their code, open CLIENT, find the profile and check them in manually. Please remind members to update the app before their next visit.":"\u0625\u0630\u0627 \u0644\u0645 \u064A\u062A\u0645\u0643\u0646 \u0627\u0644\u0639\u0645\u064A\u0644 \u0645\u0646 \u0625\u0638\u0647\u0627\u0631 \u0631\u0645\u0632\u0647\u060C \u0627\u0641\u062A\u062D\u0648\u0627 \u062A\u0628\u0648\u064A\u0628 \u0627\u0644\u0639\u0645\u0644\u0627\u0621 \u0648\u0627\u0628\u062D\u062B\u0648\u0627 \u0639\u0646 \u0645\u0644\u0641\u0647 \u0648\u0633\u062C\u0651\u0644\u0648\u0627 \u062D\u0636\u0648\u0631\u0647 \u064A\u062F\u0648\u064A\u064B\u0627. \u064A\u064F\u0631\u062C\u0649 \u062A\u0630\u0643\u064A\u0631 \u0627\u0644\u0623\u0639\u0636\u0627\u0621 \u0628\u062A\u062D\u062F\u064A\u062B \u0627\u0644\u062A\u0637\u0628\u064A\u0642 \u0642\u0628\u0644 \u0632\u064A\u0627\u0631\u062A\u0647\u0645 \u0627\u0644\u0642\u0627\u062F\u0645\u0629.","Explore the roof under the greek sun":"\u0627\u0643\u062A\u0634\u0641 \u0627\u0644\u0633\u0637\u062D \u062A\u062D\u062A \u0627\u0644\u0634\u0645\u0633 \u0627\u0644\u064A\u0648\u0646\u0627\u0646\u064A\u0629","W.O.R (Workout of the Roof)":"W.O.R (\u062A\u0645\u0631\u064A\u0646 \u0627\u0644\u0633\u0637\u062D)","The rooftop is open for W.O.R sessions: parallel bars, plyo boxes, a heavy bag and open turf, all under the Greek sun.":"\u0627\u0644\u0633\u0637\u062D \u0645\u062A\u0627\u062D \u0644\u062C\u0644\u0633\u0627\u062A W.O.R: \u0642\u0636\u0628\u0627\u0646 \u0645\u062A\u0648\u0627\u0632\u064A\u0629 \u0648\u0635\u0646\u0627\u062F\u064A\u0642 \u0642\u0641\u0632 \u0648\u0643\u064A\u0633 \u0645\u0644\u0627\u0643\u0645\u0629 \u062B\u0642\u064A\u0644 \u0648\u0645\u0633\u0627\u062D\u0629 \u0639\u0634\u0628\u064A\u0629 \u0645\u0641\u062A\u0648\u062D\u0629\u060C \u0643\u0644 \u0630\u0644\u0643 \u062A\u062D\u062A \u0627\u0644\u0634\u0645\u0633 \u0627\u0644\u064A\u0648\u0646\u0627\u0646\u064A\u0629.","Book rooftop sessions from the CLIENT > Schedule tab and choose \"Rooftop\" as the location. Sessions run up to 6 people at a time.":"\u0627\u062D\u062C\u0632\u0648\u0627 \u062C\u0644\u0633\u0627\u062A \u0627\u0644\u0633\u0637\u062D \u0645\u0646 \u062A\u0628\u0648\u064A\u0628 \u0627\u0644\u0639\u0645\u0644\u0627\u0621 > \u0627\u0644\u062C\u062F\u0648\u0644 \u0648\u0627\u062E\u062A\u0627\u0631\u0648\u0627 \u00AB\u0627\u0644\u0633\u0637\u062D\u00BB \u0643\u0645\u0643\u0627\u0646 \u0644\u0644\u062C\u0644\u0633\u0629. \u062A\u062A\u0633\u0639 \u0627\u0644\u062C\u0644\u0633\u0629 \u0644\u0645\u0627 \u064A\u0635\u0644 \u0625\u0644\u0649 6 \u0623\u0634\u062E\u0627\u0635 \u0641\u064A \u0627\u0644\u0645\u0631\u0629 \u0627\u0644\u0648\u0627\u062D\u062F\u0629.","Bring water and a towel. In strong wind or heat above 36\u00B0C, sessions move to the main floor.":"\u0623\u062D\u0636\u0631\u0648\u0627 \u0627\u0644\u0645\u0627\u0621 \u0648\u0645\u0646\u0634\u0641\u0629. \u0639\u0646\u062F \u0627\u0644\u0631\u064A\u0627\u062D \u0627\u0644\u0642\u0648\u064A\u0629 \u0623\u0648 \u0627\u0631\u062A\u0641\u0627\u0639 \u0627\u0644\u062D\u0631\u0627\u0631\u0629 \u0641\u0648\u0642 36\u00B0\u0645\u060C \u062A\u064F\u0646\u0642\u0644 \u0627\u0644\u062C\u0644\u0633\u0627\u062A \u0625\u0644\u0649 \u0627\u0644\u0635\u0627\u0644\u0629 \u0627\u0644\u0631\u0626\u064A\u0633\u064A\u0629.","Summer opening hours":"\u0645\u0648\u0627\u0639\u064A\u062F \u0627\u0644\u0639\u0645\u0644 \u0627\u0644\u0635\u064A\u0641\u064A\u0629","Doors open 06:30\u201323:00 Monday to Saturday. Sundays 09:00\u201315:00.":"\u064A\u0641\u062A\u062D \u0627\u0644\u0646\u0627\u062F\u064A \u0645\u0646 06:30 \u0625\u0644\u0649 23:00 \u0645\u0646 \u0627\u0644\u0625\u062B\u0646\u064A\u0646 \u0625\u0644\u0649 \u0627\u0644\u0633\u0628\u062A\u060C \u0648\u0645\u0646 09:00 \u0625\u0644\u0649 15:00 \u0623\u064A\u0627\u0645 \u0627\u0644\u0623\u062D\u062F.","Summer hours are now live. The gym opens at 06:30 and closes at 23:00, Monday to Saturday. On Sundays we're open 09:00\u201315:00.":"\u0628\u062F\u0623 \u0627\u0644\u0639\u0645\u0644 \u0628\u0627\u0644\u0645\u0648\u0627\u0639\u064A\u062F \u0627\u0644\u0635\u064A\u0641\u064A\u0629. \u064A\u0641\u062A\u062D \u0627\u0644\u0646\u0627\u062F\u064A \u0627\u0644\u0633\u0627\u0639\u0629 06:30 \u0648\u064A\u063A\u0644\u0642 \u0627\u0644\u0633\u0627\u0639\u0629 23:00 \u0645\u0646 \u0627\u0644\u0625\u062B\u0646\u064A\u0646 \u0625\u0644\u0649 \u0627\u0644\u0633\u0628\u062A\u060C \u0648\u064A\u0639\u0645\u0644 \u0623\u064A\u0627\u0645 \u0627\u0644\u0623\u062D\u062F \u0645\u0646 09:00 \u0625\u0644\u0649 15:00.","Coaching slots follow the same hours. Early sessions at 07:00 are the most popular, so confirm them with clients the evening before.":"\u062A\u062A\u0628\u0639 \u0645\u0648\u0627\u0639\u064A\u062F \u0627\u0644\u062A\u062F\u0631\u064A\u0628 \u0646\u0641\u0633 \u0633\u0627\u0639\u0627\u062A \u0627\u0644\u0639\u0645\u0644. \u0627\u0644\u062C\u0644\u0633\u0627\u062A \u0627\u0644\u0645\u0628\u0643\u0631\u0629 \u0627\u0644\u0633\u0627\u0639\u0629 07:00 \u0647\u064A \u0627\u0644\u0623\u0643\u062B\u0631 \u0637\u0644\u0628\u064B\u0627\u060C \u0644\u0630\u0627 \u0623\u0643\u0651\u062F\u0648\u0647\u0627 \u0645\u0639 \u0627\u0644\u0639\u0645\u0644\u0627\u0621 \u0645\u0633\u0627\u0621 \u0627\u0644\u064A\u0648\u0645 \u0627\u0644\u0633\u0627\u0628\u0642.","Coach meeting: programming review":"\u0627\u062C\u062A\u0645\u0627\u0639 \u0627\u0644\u0645\u062F\u0631\u0628\u064A\u0646: \u0645\u0631\u0627\u062C\u0639\u0629 \u0627\u0644\u0628\u0631\u0627\u0645\u062C","Friday 14:00 in the studio. Bring your three toughest client cases.":"\u0627\u0644\u062C\u0645\u0639\u0629 \u0627\u0644\u0633\u0627\u0639\u0629 14:00 \u0641\u064A \u0627\u0644\u0627\u0633\u062A\u0648\u062F\u064A\u0648. \u0623\u062D\u0636\u0631\u0648\u0627 \u0623\u0635\u0639\u0628 \u062B\u0644\u0627\u062B \u062D\u0627\u0644\u0627\u062A \u0644\u062F\u064A\u0643\u0645.","We're reviewing programming for the autumn block. Each coach brings three client cases where progress has stalled.":"\u0633\u0646\u0631\u0627\u062C\u0639 \u0627\u0644\u0628\u0631\u0627\u0645\u062C \u0627\u0644\u062A\u062F\u0631\u064A\u0628\u064A\u0629 \u0644\u0645\u0631\u062D\u0644\u0629 \u0627\u0644\u062E\u0631\u064A\u0641. \u064A\u062D\u0636\u0631 \u0643\u0644 \u0645\u062F\u0631\u0628 \u062B\u0644\u0627\u062B \u062D\u0627\u0644\u0627\u062A \u0644\u0639\u0645\u0644\u0627\u0621 \u062A\u0648\u0642\u0641 \u062A\u0642\u062F\u0645\u0647\u0645.","Please update your client notes before the meeting so we can go through attendance and progress together.":"\u064A\u064F\u0631\u062C\u0649 \u062A\u062D\u062F\u064A\u062B \u0645\u0644\u0627\u062D\u0638\u0627\u062A \u0627\u0644\u0639\u0645\u0644\u0627\u0621 \u0642\u0628\u0644 \u0627\u0644\u0627\u062C\u062A\u0645\u0627\u0639 \u0644\u0646\u062A\u0645\u0643\u0646 \u0645\u0646 \u0645\u0631\u0627\u062C\u0639\u0629 \u0627\u0644\u062D\u0636\u0648\u0631 \u0648\u0627\u0644\u062A\u0642\u062F\u0645 \u0645\u0639\u064B\u0627.","New kettlebell range arrived":"\u0648\u0635\u0644\u062A \u062A\u0634\u0643\u064A\u0644\u0629 \u0627\u0644\u0643\u064A\u062A\u0644 \u0628\u064A\u0644 \u0627\u0644\u062C\u062F\u064A\u062F\u0629","8 kg to 40 kg, now racked next to the functional zone.":"\u0645\u0646 8 \u0625\u0644\u0649 40 \u0643\u062C\u0645\u060C \u0645\u062A\u0648\u0641\u0631\u0629 \u0627\u0644\u0622\u0646 \u0628\u062C\u0648\u0627\u0631 \u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u062A\u062F\u0631\u064A\u0628 \u0627\u0644\u0648\u0638\u064A\u0641\u064A.","The new competition-style kettlebells are on the racks next to the functional zone, from 8 kg up to 40 kg in 4 kg steps.":"\u0623\u0635\u0628\u062D\u062A \u0627\u0644\u0643\u064A\u062A\u0644 \u0628\u064A\u0644 \u0627\u0644\u062C\u062F\u064A\u062F\u0629 \u0628\u0637\u0631\u0627\u0632 \u0627\u0644\u0645\u0633\u0627\u0628\u0642\u0627\u062A \u0639\u0644\u0649 \u0627\u0644\u062D\u0648\u0627\u0645\u0644 \u0628\u062C\u0648\u0627\u0631 \u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u062A\u062F\u0631\u064A\u0628 \u0627\u0644\u0648\u0638\u064A\u0641\u064A\u060C \u0645\u0646 8 \u062D\u062A\u0649 40 \u0643\u062C\u0645 \u0628\u0641\u0627\u0631\u0642 4 \u0643\u062C\u0645.","Please return them to the rack after use and wipe handles down. They're a great fit for the fat-loss circuits in the plan library.":"\u064A\u064F\u0631\u062C\u0649 \u0625\u0639\u0627\u062F\u062A\u0647\u0627 \u0625\u0644\u0649 \u0627\u0644\u062D\u0627\u0645\u0644 \u0628\u0639\u062F \u0627\u0644\u0627\u0633\u062A\u062E\u062F\u0627\u0645 \u0648\u0645\u0633\u062D \u0627\u0644\u0645\u0642\u0627\u0628\u0636. \u0648\u0647\u064A \u0645\u0646\u0627\u0633\u0628\u0629 \u062C\u062F\u064B\u0627 \u0644\u062F\u0648\u0627\u0626\u0631 \u062D\u0631\u0642 \u0627\u0644\u062F\u0647\u0648\u0646 \u0641\u064A \u0645\u0643\u062A\u0628\u0629 \u0627\u0644\u062E\u0637\u0637.","Saturday boxing clinic":"\u0639\u064A\u0627\u062F\u0629 \u0627\u0644\u0645\u0644\u0627\u0643\u0645\u0629 \u064A\u0648\u0645 \u0627\u0644\u0633\u0628\u062A","Free technique clinic for members. 10:00\u201311:30, limited to 12 spots.":"\u0639\u064A\u0627\u062F\u0629 \u062A\u0642\u0646\u064A\u0629 \u0645\u062C\u0627\u0646\u064A\u0629 \u0644\u0644\u0623\u0639\u0636\u0627\u0621 \u0645\u0646 10:00 \u0625\u0644\u0649 11:30\u060C \u0648\u0627\u0644\u0623\u0645\u0627\u0643\u0646 \u0645\u062D\u062F\u0648\u062F\u0629 \u0628\u0640 12 \u0645\u0642\u0639\u062F\u064B\u0627.","A free technique clinic focused on stance, footwork and basic combinations. It's open to all members.":"\u0639\u064A\u0627\u062F\u0629 \u062A\u0642\u0646\u064A\u0629 \u0645\u062C\u0627\u0646\u064A\u0629 \u062A\u0631\u0643\u0651\u0632 \u0639\u0644\u0649 \u0648\u0636\u0639\u064A\u0629 \u0627\u0644\u0648\u0642\u0648\u0641 \u0648\u062D\u0631\u0643\u0629 \u0627\u0644\u0642\u062F\u0645\u064A\u0646 \u0648\u0627\u0644\u062A\u0631\u0643\u064A\u0628\u0627\u062A \u0627\u0644\u0623\u0633\u0627\u0633\u064A\u0629. \u0645\u0641\u062A\u0648\u062D\u0629 \u0644\u062C\u0645\u064A\u0639 \u0627\u0644\u0623\u0639\u0636\u0627\u0621.","Spots are limited to 12. Encourage your clients to sign up at the front desk before Friday evening.":"\u0627\u0644\u0623\u0645\u0627\u0643\u0646 \u0645\u062D\u062F\u0648\u062F\u0629 \u0628\u0640 12 \u0645\u0642\u0639\u062F\u064B\u0627. \u0634\u062C\u0651\u0639\u0648\u0627 \u0639\u0645\u0644\u0627\u0621\u0643\u0645 \u0639\u0644\u0649 \u0627\u0644\u062A\u0633\u062C\u064A\u0644 \u0641\u064A \u0645\u0643\u062A\u0628 \u0627\u0644\u0627\u0633\u062A\u0642\u0628\u0627\u0644 \u0642\u0628\u0644 \u0645\u0633\u0627\u0621 \u0627\u0644\u062C\u0645\u0639\u0629.","Nutrition workshop for members":"\u0648\u0631\u0634\u0629 \u0627\u0644\u062A\u063A\u0630\u064A\u0629 \u0644\u0644\u0623\u0639\u0636\u0627\u0621","Practical meal planning for busy weeks. Thursday 19:30.":"\u062A\u062E\u0637\u064A\u0637 \u0639\u0645\u0644\u064A \u0644\u0644\u0648\u062C\u0628\u0627\u062A \u0644\u0644\u0623\u0633\u0627\u0628\u064A\u0639 \u0627\u0644\u0645\u0632\u062F\u062D\u0645\u0629. \u0627\u0644\u062E\u0645\u064A\u0633 \u0627\u0644\u0633\u0627\u0639\u0629 19:30.","A one-hour workshop with our partner dietitian covering protein targets, meal prep and eating out.":"\u0648\u0631\u0634\u0629 \u0645\u062F\u062A\u0647\u0627 \u0633\u0627\u0639\u0629 \u0645\u0639 \u0623\u062E\u0635\u0627\u0626\u064A\u0629 \u0627\u0644\u062A\u063A\u0630\u064A\u0629 \u0627\u0644\u0634\u0631\u064A\u0643\u0629 \u062A\u063A\u0637\u064A \u0623\u0647\u062F\u0627\u0641 \u0627\u0644\u0628\u0631\u0648\u062A\u064A\u0646 \u0648\u062A\u062D\u0636\u064A\u0631 \u0627\u0644\u0648\u062C\u0628\u0627\u062A \u0648\u0627\u0644\u0623\u0643\u0644 \u062E\u0627\u0631\u062C \u0627\u0644\u0645\u0646\u0632\u0644.","Great for clients on fat-loss and muscle-gain plans. Recommend it during your next check-in.":"\u0645\u0646\u0627\u0633\u0628\u0629 \u062C\u062F\u064B\u0627 \u0644\u0644\u0639\u0645\u0644\u0627\u0621 \u0627\u0644\u0630\u064A\u0646 \u064A\u062A\u0628\u0639\u0648\u0646 \u062E\u0637\u0637 \u062D\u0631\u0642 \u0627\u0644\u062F\u0647\u0648\u0646 \u0648\u0628\u0646\u0627\u0621 \u0627\u0644\u0639\u0636\u0644\u0627\u062A. \u0627\u0642\u062A\u0631\u062D\u0648\u0647\u0627 \u0639\u0644\u064A\u0647\u0645 \u0641\u064A \u0627\u0644\u0645\u062A\u0627\u0628\u0639\u0629 \u0627\u0644\u0642\u0627\u062F\u0645\u0629.","30-day consistency challenge":"\u062A\u062D\u062F\u064A \u0627\u0644\u0627\u0633\u062A\u0645\u0631\u0627\u0631\u064A\u0629 \u0644\u0645\u062F\u0629 30 \u064A\u0648\u0645\u064B\u0627","Members who train 12+ times this month join the leaderboard.":"\u0627\u0644\u0623\u0639\u0636\u0627\u0621 \u0627\u0644\u0630\u064A\u0646 \u064A\u062A\u062F\u0631\u0628\u0648\u0646 12 \u0645\u0631\u0629 \u0623\u0648 \u0623\u0643\u062B\u0631 \u0647\u0630\u0627 \u0627\u0644\u0634\u0647\u0631 \u064A\u0646\u0636\u0645\u0648\u0646 \u0625\u0644\u0649 \u0644\u0648\u062D\u0629 \u0627\u0644\u0645\u062A\u0635\u062F\u0631\u064A\u0646.","Starting on the 1st, every member who completes 12 or more visits in a month enters the leaderboard.":"\u0627\u0639\u062A\u0628\u0627\u0631\u064B\u0627 \u0645\u0646 \u0627\u0644\u0623\u0648\u0644 \u0645\u0646 \u0627\u0644\u0634\u0647\u0631\u060C \u064A\u062F\u062E\u0644 \u0643\u0644 \u0639\u0636\u0648 \u064A\u064F\u0643\u0645\u0644 12 \u0632\u064A\u0627\u0631\u0629 \u0623\u0648 \u0623\u0643\u062B\u0631 \u062E\u0644\u0627\u0644 \u0627\u0644\u0634\u0647\u0631 \u0625\u0644\u0649 \u0644\u0648\u062D\u0629 \u0627\u0644\u0645\u062A\u0635\u062F\u0631\u064A\u0646.","Attendance is tracked from the QR scan, so please make sure every session starts with a scan.":"\u064A\u064F\u0633\u062C\u064E\u0651\u0644 \u0627\u0644\u062D\u0636\u0648\u0631 \u0645\u0646 \u0645\u0633\u062D \u0631\u0645\u0632 QR\u060C \u0644\u0630\u0627 \u064A\u064F\u0631\u062C\u0649 \u0627\u0644\u062A\u0623\u0643\u062F \u0645\u0646 \u0623\u0646 \u0643\u0644 \u062C\u0644\u0633\u0629 \u062A\u0628\u062F\u0623 \u0628\u0627\u0644\u0645\u0633\u062D.","Main floor & Rooftop":"\u0627\u0644\u0635\u0627\u0644\u0629 \u0627\u0644\u0631\u0626\u064A\u0633\u064A\u0629 \u0648\u0627\u0644\u0633\u0637\u062D","Strength & Conditioning":"\u0627\u0644\u0642\u0648\u0629 \u0648\u0627\u0644\u0644\u064A\u062 /* =====================================================================

   ---------------------------------------------------------------------
   The coach only types the client's basic data. The app NEVER generates a Client ID, QR code or password:
   all three are created by the server and handed back. Nothing here is connected yet - this only fixes the interface.
   FUTURE SERVER CONTRACT - GN_ServerGateway.register({ createClientAccount, ... }):
     createClientAccount(clientData, { requestId })
        clientData = { name, phone, age, height, weight, goal }        (empty optional fields are null; height cm, weight kg)
        requestId  = idempotency key of ONE submission: the server must create at most one account per requestId
        -> { ok:true, clientId, registrationNumber, password, qrCode, accountStatus, clientData }   (extra fields are kept untouched)
        registrationNumber = 7-digit number, unique per trainee, generated by the server only (string, may start with 0); shown read-only in the client profile
        -> { ok:false, message }  or throw an Error with code "network" / "timeout" (outcome unknown -> the same requestId is re-sent)
     qrCode = image URL (https), data: URI or <svg> markup rendered by the server.
     password = handed over by the server for the captain's screen; the app keeps it in memory only (never localStorage / console / DB).
     clientId = THE client identifier everywhere (membership, attendance, QR scanner): the app uses it as both id and code.
